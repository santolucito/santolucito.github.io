<!doctype html>
<html lang="en">

<title>Ox Cart to Market</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* layout: one full-bleed canvas, always played landscape (rotates itself on a portrait phone) */
:root{
  --paper:#f1e6cc; --ink:#3a2a20; --barn-red:#9b3a2a; --gold:#e3b23c; --hill:#7f9150; --sky:#b7cdd0;
  --display:'IM Fell English',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
#stage{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--display);color:var(--paper)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Ox Cart to Market, a paper cut-out farm game"></canvas></div>
<script>
(()=>{'use strict';
/* ============================================================
   Ox Cart to Market — a paper cut-out farm year for small hands
   ============================================================ */
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=540,TAU=Math.PI*2;
let W=960,SC=1,offY=0,portrait=false,cw=1,ch=1,dpr=1;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}
const FONT="'IM Fell English',Georgia,'Times New Roman',serif";
const INK='#3a2a20',PAPER='#f1e6cc',WOOD='#8a633c',DWOOD='#5d412a',RED='#9b3a2a',ROOF='#544842',GOLD='#e3b23c';

/* ---------- paper shape helpers ---------- */
let PX=1;
function sh(g,on){if(on===false){g.shadowColor='rgba(0,0,0,0)';g.shadowBlur=0;g.shadowOffsetX=0;g.shadowOffsetY=0}
  else{g.shadowColor='rgba(50,30,12,.36)';g.shadowBlur=4*PX;g.shadowOffsetX=1.2*PX;g.shadowOffsetY=2.4*PX}}
function poly(g,col,p){g.fillStyle=col;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function rect(g,col,x,y,w,h,r){g.fillStyle=col;g.beginPath();if(r&&g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
function circ(g,col,x,y,r){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function ell(g,col,x,y,rx,ry,rot){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU);g.fill()}
function blob(g,col,x,y,rx,ry,seed,wob=.09,n=16){const r=rng(seed);g.fillStyle=col;g.beginPath();
  for(let i=0;i<n;i++){const a=i/n*TAU,k=1+(r()-.5)*2*wob,px=x+Math.cos(a)*rx*k,py=y+Math.sin(a)*ry*k;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fill()}
function puff(g,col,x,y,rx,ry,seed,n=9,r0=.42){const r=rng(seed);for(let i=0;i<n;i++){const a=i/n*TAU+r()*.3;circ(g,col,x+Math.cos(a)*rx*.72,y+Math.sin(a)*ry*.72,Math.min(rx,ry)*(r0+r()*.2))}ell(g,col,x,y,rx*.8,ry*.8)}
function line(g,col,w,p){g.save();sh(g,false);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke();g.restore()}
function flat(g,fn){g.save();sh(g,false);fn();g.restore()}
function txt(g,s,x,y,size,col,align,italic){g.save();sh(g,false);g.font=(italic?'italic ':'')+size+'px '+FONT;g.textAlign=align||'center';g.textBaseline='middle';g.fillStyle=col||INK;g.fillText(s,x,y);g.restore()}

/* ---------- sprite cache: every sprite is cut once, then pasted ---------- */
const DEF={},cache={};
function def(name,w,h,fn,ss){DEF[name]=[w,h,fn,ss||2]}
function sprite(name){let s=cache[name];if(!s){const d=DEF[name];if(!d)throw new Error('no sprite '+name);const c=document.createElement('canvas'),ss=d[3];c.width=d[0]*ss;c.height=d[1]*ss;
  const g=c.getContext('2d');g.scale(ss,ss);const o=PX;PX=ss;sh(g);d[2](g);PX=o;s=cache[name]={c,w:d[0],h:d[1]}}return s}
// anchor: ay===1 means "standing on the ground" (ground line is 6px above the sprite's bottom edge)
function put(g,name,x,y,s=1,r=0,ax=.5,ay=1,fx=1){const sp=sprite(name);g.save();g.translate(x,y);if(r)g.rotate(r);g.scale(s*fx,s);
  g.drawImage(sp.c,-ax*sp.w,ay===1?-(sp.h-6):-ay*sp.h,sp.w,sp.h);g.restore()}

/* ---------- goods ---------- */
def('wool',64,64,g=>{blob(g,'#e2d3b3',32,39,21,19,3,.07);rect(g,WOOD,23,19,18,4,2);puff(g,'#fbf7ec',32,13,13,8,5,7)});
def('mittens',64,64,g=>{const m=(x,y,r)=>{g.save();g.translate(x,y);g.rotate(r);circ(g,'#b3402f',-11,2,6);rect(g,'#b3402f',-9,-16,18,28,8);rect(g,'#f3ead6',-10,8,20,9,3);g.restore()};m(23,34,-.22);m(42,38,.2)});
def('candles',64,64,g=>{for(let i=0;i<4;i++){line(g,INK,1.5,[19+i*9,20,19+i*9,13]);rect(g,i%2?'#f3ead6':'#ece0c2',15.5+i*9,19,7.5,39,2)}rect(g,RED,12,38,41,6,2)});
def('brooms',64,64,g=>{const b=r=>{g.save();g.translate(32,34);g.rotate(r);poly(g,WOOD,[-2,-30,2,-30,3,4,-3,4]);poly(g,'#cfa64f',[-7,2,7,2,13,24,-13,24]);rect(g,DWOOD,-7,1,14,4,1);g.restore()};b(-.28);b(.28)});
def('potatoes',64,64,g=>{blob(g,'#bd9160',22,27,8,6,1);blob(g,'#b3855a',34,24,9,7,2);blob(g,'#c19a6b',44,28,7,6,3);poly(g,'#9c7b52',[11,58,9,31,55,31,53,58]);line(g,'#7d6140',1.5,[14,38,50,38])});
def('apples',64,64,g=>{[[20,23],[31,19],[43,23],[26,25],[37,25]].forEach((p,i)=>circ(g,i%2?'#b53a2b':'#c44a31',p[0],p[1],6.5));
  poly(g,WOOD,[14,26,50,26,55,42,50,58,14,58,9,42]);line(g,DWOOD,2.5,[12,34,52,34]);line(g,DWOOD,2.5,[12,50,52,50]);line(g,'#74522f',1,[24,27,23,57]);line(g,'#74522f',1,[40,27,41,57])});
def('honey',64,64,g=>{blob(g,'#d7922b',32,41,18,17,4,.04,20);flat(g,()=>ell(g,'#eab858',25,38,4,8,.2));poly(g,'#f3ead6',[15,27,49,27,45,15,19,15]);rect(g,RED,17,24,30,4,2)});
def('sugar',64,64,g=>{rect(g,'#7a4a26',14,22,14,10,2);rect(g,'#8a5730',25,19,14,13,2);rect(g,'#7a4a26',36,22,14,10,2);rect(g,'#a97c4b',9,30,46,28,3);
  flat(g,()=>{g.save();g.translate(32,44);poly(g,'#c8552b',[0,-11,3,-5,9,-7,6,-1,11,2,4,4,5,10,0,6,-5,10,-4,4,-11,2,-6,-1,-9,-7,-3,-5]);g.restore()})});
def('kettle',64,64,g=>{flat(g,()=>{g.strokeStyle='#2b2a2c';g.lineWidth=3.5;g.beginPath();g.arc(32,26,19,Math.PI,0);g.stroke()});
  rect(g,'#232224',17,54,5,5,1);rect(g,'#232224',42,54,5,5,1);blob(g,'#2f2e31',32,41,22,16,2,.03,22);rect(g,'#3d3c40',12,24,40,6,3)});
def('needle',64,64,g=>{rect(g,'#f3ead6',15,9,34,46,3);line(g,'#b3402f',2.2,[22,44,27,36,24,29,31,24,29,17]);line(g,'#8d9499',3,[24,47,42,16]);flat(g,()=>circ(g,'#f3ead6',41,18,1)) });
def('knife',64,64,g=>{poly(g,'#c9cdd0',[34,33,59,27,57,36,37,45]);rect(g,'#7a4a26',7,33,33,13,6);flat(g,()=>{circ(g,GOLD,14,39.5,2);circ(g,GOLD,33,39.5,2)})});
def('candy',64,64,g=>{[[22,18],[33,14],[43,19]].forEach(p=>{circ(g,'#fbf7ec',p[0],p[1],7);flat(g,()=>{g.strokeStyle='#c44a31';g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],3.5,0,4.6);g.stroke()})});
  poly(g,'#f3ead6',[15,22,49,22,53,58,11,58]);flat(g,()=>{for(let i=0;i<3;i++)poly(g,'#c44a31',[19+i*11,22,24+i*11,22,24+i*11.6,58,18+i*11.6,58])})});
def('coin',30,30,g=>{circ(g,GOLD,15,14,11);flat(g,()=>{g.strokeStyle='#b98a22';g.lineWidth=1.6;g.beginPath();g.arc(15,14,7.5,0,TAU);g.stroke();circ(g,'#f3d37a',12,11,2)})});
def('heart',34,34,g=>{g.fillStyle='#c44a31';g.beginPath();g.moveTo(17,28);g.bezierCurveTo(2,17,5,5,12,5);g.bezierCurveTo(15,5,17,8,17,10);g.bezierCurveTo(17,8,19,5,22,5);g.bezierCurveTo(29,5,32,17,17,28);g.fill()});
def('spud',28,26,g=>{blob(g,'#b98b5a',14,12,10,7,7);flat(g,()=>{circ(g,'#94683f',10,10,1);circ(g,'#94683f',17,13,1)})});
def('apple',30,32,g=>{circ(g,'#bf4330',15,17,10);flat(g,()=>{poly(g,'#5f7a3a',[15,8,22,3,21,9]);circ(g,'#d86a4e',11,13,2.5)})});
def('bucket',52,52,g=>{line(g,'#6d6d6d',2,[10,14,26,2,42,14]);poly(g,'#9a7448',[8,13,44,13,40,44,12,44]);line(g,DWOOD,2,[9,20,43,20]);line(g,DWOOD,2,[11,37,41,37])});

/* ---------- people ---------- */
function person(g,o){const skin=o.skin||'#e3b590',shoe='#2a211c';
  if(o.dress){rect(g,shoe,20,112,9,6,2);rect(g,shoe,31,112,9,6,2);poly(g,o.coat,[19,46,41,46,51,113,9,113]);if(o.apron)poly(g,o.apron,[24,58,36,58,41,109,19,109])}
  else{if(!o.nolegs){rect(g,o.legs||'#6a5843',21,84,8,30);rect(g,o.legs||'#6a5843',31,84,8,30);rect(g,shoe,19,112,11,6,2);rect(g,shoe,30,112,11,6,2)}
    poly(g,o.coat,[17,44,43,44,46,90,14,90])}
  poly(g,o.arm||o.coat,[11,49,20,46,21,80,12,80]);poly(g,o.arm||o.coat,[40,46,49,49,48,80,39,80]);
  circ(g,skin,16.5,83,4.5);circ(g,skin,43.5,83,4.5);
  if(o.stick)poly(g,WOOD,[45,88,47,88,56,26,54,26]);
  if(o.hat==='bonnet')circ(g,'#f6f0e0',30,29,15.5);
  if(o.hair&&o.hat!=='bonnet')circ(g,o.hair,30,29,14.5);
  if(o.braids){rect(g,o.hair,13,30,6,24,3);rect(g,o.hair,41,30,6,24,3)}
  circ(g,skin,30,32,13);
  if(o.beard)blob(g,o.beard,30,41,11,8,9,.1,12);
  flat(g,()=>{circ(g,INK,25,31,1.6);circ(g,INK,35,31,1.6);circ(g,'#d9907a',22,36,2.6);circ(g,'#d9907a',38,36,2.6);
    if(!o.beard){g.strokeStyle=INK;g.lineWidth=1.3;g.beginPath();g.arc(30,36,4,.3,Math.PI-.3);g.stroke()}});
  if(o.hat==='brim'){rect(g,'#2a241f',20,8,20,15,4);ell(g,'#2a241f',30,22,21,4.5)}
  if(o.hat==='top'){rect(g,'#2a241f',21,0,18,22,2);ell(g,'#2a241f',30,22,17,4)}
  if(o.hat==='cap'){g.fillStyle=o.cap||'#6a5843';g.beginPath();g.arc(30,25,13.5,Math.PI,0);g.fill();rect(g,o.cap||'#6a5843',30,22,17,4,2)}
  if(o.hat==='bonnet')flat(g,()=>line(g,'#d8cfb8',1.5,[17,24,43,24]));
  if(o.collar)poly(g,'#f3ead6',[23,45,37,45,30,53]);
}
const FARMER={coat:'#2f3b4c',hat:'brim',beard:'#6b4a30',stick:true,collar:true};
def('man',64,100,g=>person(g,{...FARMER,nolegs:true}));
def('manleg',16,46,g=>{rect(g,'#6a5843',4,3,8,32,3);rect(g,'#2a211c',2,33,13,7,2)});
def('wife',60,124,g=>person(g,{dress:true,coat:'#56708a',apron:'#f3ead6',hat:'bonnet'}));
def('girl',60,124,g=>person(g,{dress:true,coat:'#a8452f',apron:'#f3ead6',hair:'#b9843a',braids:true}));
def('boy',60,124,g=>person(g,{coat:'#7a6a3a',legs:'#4a4035',hat:'cap',hair:'#6b4a30',collar:true}));
def('buyer1',60,124,g=>person(g,{coat:'#6e3a36',hat:'top',beard:'#d8d2c4',collar:true,legs:'#3d3a3a'}));
def('buyer2',60,124,g=>person(g,{dress:true,coat:'#5f7a4a',apron:'#e9dcc0',hat:'bonnet'}));
def('buyer3',60,124,g=>person(g,{coat:'#c08a3a',hat:'cap',cap:'#3d3a3a',hair:'#3a2a20',collar:true,legs:'#4a4035'}));
def('keeper',60,124,g=>person(g,{coat:'#3f5a52',apron:'#f3ead6',hair:'#8a8378',beard:'#8a8378',collar:true}));

/* ---------- ox & cart ---------- */
def('oxbody',184,100,g=>{poly(g,'#8a4a2b',[26,34,21,40,13,72,18,73]);blob(g,'#3a2a20',15,76,4,6,2);
  blob(g,'#9a5632',80,48,56,26,3,.04,22);blob(g,'#9a5632',114,36,26,19,4,.05);
  poly(g,'#efe2c0',[140,30,146,11,151,13,148,32]);
  blob(g,'#a35d38',148,47,19,17,5,.05);ell(g,'#84472a',134,37,8,4.5,-.5);
  poly(g,'#efe2c0',[152,31,164,15,168,19,158,35]);
  ell(g,'#ead6b4',161,55,9.5,8.5);flat(g,()=>{circ(g,INK,151,43,2.2);circ(g,'#8a5a44',164,54,1.5);circ(g,'#8a5a44',160,57,1.3)});
  rect(g,'#c9a24e',117,10,9,52,4);rect(g,'#b08a3e',110,8,23,7,3)});
def('oxleg',22,58,g=>{rect(g,'#9a5632',6,3,10,43,4);rect(g,'#2a211c',5,44,12,7,2)});
def('oxlegd',22,58,g=>{rect(g,'#7f4426',6,3,10,43,4);rect(g,'#2a211c',5,44,12,7,2)});
def('cart',214,100,g=>{poly(g,WOOD,[150,56,210,49,210,55,150,65]);poly(g,'#a97c4b',[14,34,160,34,152,66,22,66]);
  flat(g,()=>{for(let i=1;i<6;i++)line(g,'#8a633c',1.3,[16+i*24.5,36,23+i*21.5,65]);});
  rect(g,WOOD,9,30,156,6,2);rect(g,DWOOD,18,30,5,36,1);rect(g,DWOOD,151,30,5,36,1)});
def('wheel',72,72,g=>{g.fillStyle=DWOOD;g.beginPath();g.arc(36,36,31,0,TAU);g.arc(36,36,24,0,TAU,true);g.fill();
  for(let i=0;i<4;i++){g.save();g.translate(36,36);g.rotate(i*Math.PI/4);rect(g,'#74522f',-26,-2.5,52,5,1);g.restore()}circ(g,DWOOD,36,36,7);flat(g,()=>circ(g,'#b08a3e',36,36,2.5))});

/* ---------- buildings ---------- */
function win(g,x,y,lit,w=20,h=28){rect(g,lit?'#f2c45a':'#46545c',x,y,w,h,1);flat(g,()=>{line(g,'#f6f0e0',1.6,[x+w/2,y,x+w/2,y+h]);line(g,'#f6f0e0',1.6,[x,y+h/2,x+w,y+h/2])})}
function house(g,lit){rect(g,'#9c5a44',108,26,24,34);rect(g,'#efe6d2',30,90,180,104);
  flat(g,()=>{for(let y=100;y<194;y+=10)line(g,'#ddd2ba',1,[31,y,209,y])});
  poly(g,ROOF,[18,95,62,46,178,46,222,95]);rect(g,DWOOD,108,142,24,52,1);
  [44,76,144,176].forEach(x=>win(g,x,108,lit));[44,176].forEach(x=>win(g,x,152,lit))}
def('house',240,200,g=>house(g,false));def('houselit',240,200,g=>house(g,true));
def('barn',220,190,g=>{poly(g,RED,[20,184,20,90,60,46,110,26,160,46,200,90,200,184]);
  poly(g,ROOF,[10,94,56,40,110,18,164,40,210,94,199,97,160,52,110,32,60,52,21,97]);
  rect(g,'#5b2a20',82,108,56,76,1);flat(g,()=>{g.strokeStyle='#f3ead6';g.lineWidth=3;g.strokeRect(82,108,56,76);line(g,'#f3ead6',3,[82,108,138,184]);line(g,'#f3ead6',3,[138,108,82,184])});
  rect(g,'#5b2a20',98,58,24,24,1);flat(g,()=>{g.strokeStyle='#f3ead6';g.lineWidth=2.5;g.strokeRect(98,58,24,24)})});
def('church',150,250,g=>{rect(g,'#f3ecd9',57,68,36,80);rect(g,'#f3ecd9',22,140,106,104);poly(g,ROOF,[12,144,75,98,138,144]);
  poly(g,ROOF,[53,72,75,8,97,72]);rect(g,'#46545c',68,84,14,22,7);rect(g,DWOOD,63,196,24,48,12);
  [36,100].forEach(x=>rect(g,'#46545c',x,168,14,40,7))});
def('cottage',170,150,g=>{rect(g,'#9c5a44',40,26,18,30);rect(g,'#d9b56a',22,78,126,66);poly(g,ROOF,[12,82,48,40,122,40,158,82]);rect(g,DWOOD,76,104,20,40,1);win(g,36,96,false,18,22);win(g,114,96,false,18,22)});
def('townrow',520,260,g=>{const r=rng(11),cols=['#a8553d','#e8dcc0','#b8694a','#c9a24e','#8fa3a8','#a8553d'];let x=8,i=0;
  while(x<500){const w=74+Math.floor(r()*40),h=120+Math.floor(r()*90),c=cols[i%cols.length],y=254-h;
    rect(g,'#7d3f2e',x+w*.2,y-24,13,30);if(i%2)rect(g,'#7d3f2e',x+w*.7,y-20,13,26);
    rect(g,c,x,y,w,h);if(i%3===0)poly(g,ROOF,[x-5,y+2,x+w/2,y-34,x+w+5,y+2]);else rect(g,ROOF,x-4,y-7,w+8,11,1);
    const nx=Math.max(2,Math.floor(w/30)),ny=Math.floor((h-66)/40)+1;
    for(let a=0;a<nx;a++)for(let b=0;b<ny;b++)win(g,x+(a+.5)*w/nx-7,y+16+b*40,false,14,22);
    rect(g,DWOOD,x+w/2-9,254-36,18,36,1);x+=w+3;i++}});
def('ships',320,260,g=>{rect(g,'#6f9aa6',0,214,320,46);[[70,1],[190,.82],[270,.6]].forEach(([x,s])=>{

  function slots(){const a=[];for(const it of items)if(it.state==='cart')a[it.slot]=it.id;for(let i=0;i<8;i++)a[i]=a[i]||null;return a}
  const shelfY=[278,424];
  return{
  enter(){G.loaded=[];G.bought=[];G.coins=0;const w=bx1()-bx0-70;items=ITEMS.map((it,i)=>({id:it[0],i,x:bx0+35+(i%4+.5)*w/4,y:shelfY[i<4?0:1],state:'shelf'}));
    setCap(G.year>1?'October again. Load the cart!':'October. Load the cart!')},
  bg(g){const p=land(g,'autumn',4);ground(g,p.field,420);put(g,'treeB',W*.93,430,1.15);put(g,'treeA',W*.58,424,.9);put(g,'house',W*.76,426,.62);put(g,'haystack',W*.52,440,.9);
    ground(g,p.grass,446,5);for(let i=0;i<4;i++)put(g,'fence',bx1()+70+i*122,452,1);ground(g,p.road,462,6);
    // barn cut-away
    const x0=bx0,x1=bx1(),mid=(x0+x1)/2;
    poly(g,RED,[x0,H+10,x0,150,x0+(mid-x0)*.45,74,mid,40,x1-(mid-x0)*.45,74,x1,150,x1,H+10]);
    poly(g,ROOF,[x0-12,158,x0+(mid-x0)*.42,66,mid,28,x1-(mid-x0)*.42,66,x1+12,158,x1,162,x1-(mid-x0)*.45,82,mid,46,x0+(mid-x0)*.45,82,x0,162]);
    rect(g,'#4a2a20',x0+24,150,x1-x0-48,H);flat(g,()=>{g.strokeStyle='#f3ead6';g.lineWidth=5;g.strokeRect(x0+24,150,x1-x0-48,H);
      const r=rng(8);for(let i=0;i<40;i++){const x=x0+30+r()*(x1-x0-60),y=160+r()*300;line(g,'#5b382a',1.5,[x,y,x,y+30+r()*40])}});
    rect(g,WOOD,x0+24,shelfY[0],x1-x0-48,12,2);g.fillStyle='#d9b85a';g.beginPath();g.moveTo(x0+26,H+10);for(let x=x0+26;x<=x1-26;x+=14)g.lineTo(x,shelfY[1]-2+((x/14)%2)*6);g.lineTo(x1-26,H+10);g.fill();
    rect(g,'#4a2a20',mid-16,84,32,32,2);flat(g,()=>{g.strokeStyle='#f3ead6';g.lineWidth=3;g.strokeRect(mid-16,84,32,32)})},
  update(dt){oxHop=Math.max(0,oxHop-dt*3);const left=items.find(i=>i.state==='shelf');G.hint=(left&&!drag&&G.t>1.2&&G.loaded.length<2)?{x:left.x,y:left.y-30}:null},
  draw(g){const cx=cartX();drawCart(g,cx,GY,GS,0,0,slots());drawOx(g,cx+158*GS/1.0*.96,GY,GS,0,0,Math.sin(oxHop*Math.PI)*10);drawMan(g,bx1()+34,GY+10,1.15,0);
    for(const it of items)if(it.state==='shelf')put(g,it.id,it.x,it.y,1.12+Math.sin(G.t*2.4+it.i)*.03);
    if(drag)put(g,drag.id,drag.x,drag.y+30,1.35,Math.sin(G.t*10)*.05)},
  down(x,y){let best=null,bd=70;for(const it of items)if(it.state==='shelf'){const d=Math.hypot(x-it.x,y-(it.y-30));if(d<bd){bd=d;best=it}}
    if(best){drag=best;best.state='drag';best.x=x;best.y=y;moved=0;sfx.rustle()}},
  move(x,y,dx,dy){if(drag){drag.x=x;drag.y=y;moved+=Math.hypot(dx,dy)}},
  up(){if(!drag)return;const it=drag;drag=null;const home=items.indexOf(it);
    if(moved<14||it.x>bx1()-30){it.state='fly';const n=nSlot++,[sx,sy]=slotPos(n,cartX(),GY,GS);
      fly({name:it.id,x0:it.x,y0:it.y+30,x1:sx,y1:sy+16*GS,s0:1.2,s1:.6,arc:110,dur:.65,done(){it.state='cart';it.slot=n;G.loaded.push(it.id);sfx.pop();oxHop=1;
        if(G.loaded.length===ITEMS.length){setCap('All packed. Off to market!');sfx.moo();setNext(()=>go('road'))}}})}
    else{const w=bx1()-bx0-70;it.state='shelf';it.x=bx0+35+(home%4+.5)*w/4;it.y=shelfY[home<4?0:1]}}
  };
};

/* ---- the road ---- */
function makeRoad(cfg){
  const len=cfg.len,P=PAL[cfg.season];let pos=cfg.start||220,vel=0,boost=0,ph=0,stepT=0,idle=0,done=false;
  const gauss=u=>Math.exp(-u*u);
  const gy=cfg.flat?()=>430:x=>430-30*gauss((x-850)/260)-125*gauss((x-2900)/400)-28*gauss((x-3950)/260);
  const slope=x=>Math.atan((gy(x+20)-gy(x-20))/40);
  const lm=[];const R=rng(cfg.seed||5);
  const add=(x,n,s,dy,o)=>lm.push(Object.assign({x,n,s:s||1,dy:dy||0,hop:0},o||{}));
  const blocked=x=>(cfg.river&&x>cfg.river[0]-160&&x<cfg.river[1]+160)||(cfg.noTrees||[]).some(r=>x>r[0]&&x<r[1]);
  for(let x=60;x<len+900;x+=120+R()*150){if(blocked(x))continue;add(x,P.trees[Math.floor(R()*P.trees.length)],.75+R()*.45,-22-R()*42,{tap:'tree'})}
  for(let x=140;x<len+900;x+=210+R()*260){if(blocked(x))continue;const k=R();add(x,k<.45?'wall':k<.75?'tuft':'fence',1.15,62+R()*30,{front:true})}
  (cfg.marks||[]).forEach(m=>add(...m));
  lm.sort((a,b)=>a.dy-b.dy);
  const stars=Array.from({length:40},()=>[R(),R()*.5,R()*2+1]);
  const snow=cfg.snow?Array.from({length:70},()=>[R(),R(),R()*2+1.5,R()*TAU]):null;
  const SKY=[[0,'#e9c9a0','#f8e9c8'],[.14,'#b7cdd0','#f4e6c4'],[.36,'#b7cdd0','#f4e6c4'],[.48,'#d98f5a','#f6d59a'],[.58,'#27345a','#5a6490'],[.74,'#27345a','#5a6490'],[.86,'#e2ab9a','#f8e4c2'],[1,'#b7cdd0','#f4e6c4']];
  function skyAt(p){for(let i=1;i<SKY.length;i++)if(p<=SKY[i][0]){const a=SKY[i-1],b=SKY[i],t=(p-a[0])/(b[0]-a[0]);return[mix(a[1],b[1],t),mix(a[2],b[2],t)]}return[SKY[7][1],SKY[7][2]]}
  const cam=()=>pos-W*.3+(cfg.cart?110:0);
  return{
  enter(){setCap(cfg.caption)},
  update(dt){boost=Math.max(0,boost-dt);const want=(G.held||boost>0)&&!done?(cfg.speed||165):0;vel=lerp(vel,want,1-Math.pow(.002,dt));pos+=vel*dt;ph+=vel*dt*.045;
    if(vel>30){idle=0;stepT-=dt;if(stepT<=0){stepT=.3;sfx.clop(Math.random()<.5)}}else idle+=dt;
    G.hint=idle>1.6&&!done?{x:W*.5,y:H*.6,hold:true}:null;
    for(const m of lm)m.hop=Math.max(0,m.hop-dt*2.5);
    if(pos>=len&&!done){done=true;go(cfg.dest)}},
  draw(g){const p=clamp(pos/len,0,1),cx=cam();let night=0,top=P.skyT,bot=P.skyB;
    if(cfg.daynight){[top,bot]=skyAt(p);night=clamp(Math.min((p-.47)/.09,(.86-p)/.09),0,1)}
    if(cfg.dusk){top='#55608a';bot='#e8b79a'}
    flat(g,()=>{const gr=g.createLinearGradient(0,0,0,400);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);
      if(night>0){g.globalAlpha=night;for(const s of stars)circ(g,'#f8f1de',s[0]*W,s[1]*H,s[2]);g.globalAlpha=1}});
    if(cfg.daynight){const sp=p<.52?p/.52:(p>.82?(p-.82)/.36:-1);if(sp>=0)put(g,'sun',W*(.15+sp*.7),300-Math.sin(sp*Math.PI)*230,1,0,.5,.5);
      if(night>0){g.globalAlpha=night;put(g,'moon',W*.72,90,1,0,.5,.5);g.globalAlpha=1}}
    if(cfg.dusk)put(g,'moon',W*.8,80,1,0,.5,.5);
    for(let i=0;i<4;i++){const x=((i*430-cx*.06+G.t*6)%(W+400)+W+400)%(W+400)-200;put(g,'cloud',x,60+i%2*50,.7+i%3*.2,0,.5,.5)}
    const st=(n,f,y)=>{const sp=sprite(n);let ox=-(((cx*f)%1400)+1400)%1400;for(;ox<W;ox+=1400)g.drawImage(sp.c,ox,y,1400,210)};
    st('hf_'+cfg.season,.12,150);
    if(cfg.sea){const a=clamp((pos-cfg.sea)/700,0,1);if(a>0)flat(g,()=>{g.globalAlpha=a;rect(g,'#6f9aa6',0,262,W,150);g.globalAlpha=1})}
    st('hm_'+cfg.season,.3,215);
    // field + road follow the hill
    const x0=Math.floor(cx/20)*20-40,x1=cx+W+40;
    const band=(col,top,shadow)=>{g.save();if(!shadow)sh(g,false);else{PX=SC;sh(g)}g.fillStyle=col;g.beginPath();g.moveTo(x0-cx,H+20);for(let x=x0;x<=x1;x+=20)g.lineTo(x-cx,gy(x)+top);g.lineTo(x1-cx,H+20);g.closePath();g.fill();g.restore()};
    band(P.field,-78,true);
    for(const m of lm){if(m.front)continue;const sx=m.x-cx;if(sx<-320||sx>W+320)continue;drawMark(g,m,sx,gy(m.x)-20+m.dy)}
    band(P.grass,-12,true);band(P.road,-4,false);band(P.grass,34,true);
    if(cfg.river){const a=cfg.river[0]-cx,b=cfg.river[1]-cx,y=gy(cfg.river[0]);if(b>-100&&a<W+100){PX=SC;g.save();sh(g);poly(g,'#6f9aa6',[a+26,y-82,b-26,y-82,b+30,H+20,a-30,H+20]);g.restore();
      flat(g,()=>{for(let i=0;i<7;i++){const yy=y-60+i*26+Math.sin(G.t*1.5+i)*2,xx=(a+b)/2+Math.sin(i*2.1)*60;line(g,'#a9c6cc',2.5,[xx-22,yy,xx+22,yy])}});
      put(g,'bridgeback',a-70,y+14-150,1,0,0,0)}}
    // travellers
    const fy=x=>gy(x)+12;
    if(cfg.cart){const ox=pos+162,mx=pos+262;drawCart(g,pos-cx,fy(pos),1,slope(pos),ph*.75,cfg.cart());drawOx(g,ox-cx,fy(ox),1,slope(ox),ph);drawMan(g,mx-cx,fy(mx)+2,1,ph*1.1)}
    else drawMan(g,pos-cx,fy(pos)+2,1.05,ph*1.1,'kettle');
    if(cfg.river){const a=cfg.river[0]-cx,y=gy(cfg.river[0]);if(a>-500&&a<W+100)put(g,'bridge',a-70,y+14-150,1,0,0,0)}
    for(const m of lm){if(!m.front)continue;const sx=m.x-cx;if(sx<-200||sx>W+200)continue;drawMark(g,m,sx,gy(m.x)+m.dy)}
    if(night>0||cfg.dusk)flat(g,()=>{g.fillStyle=`rgba(22,30,66,${cfg.dusk?.22:.4*night})`;g.fillRect(0,0,W,H)});
    if(snow)flat(g,()=>{for(const s of snow){const x=((s[0]*W-cx*.5+Math.sin(G.t+s[3])*20)%W+W)%W,y=(s[1]*H+G.t*(30+s[2]*12))%H;circ(g,'#fbf8f0',x,y,s[2])}});
    // little trail map
    const mw=Math.min(300,W*.34),mx0=W/2-mw/2,my=H-22;flat(g,()=>{g.globalAlpha=.9;rect(g,PAPER,mx0-22,my-13,mw+44,26,13);g.globalAlpha=1;
      g.setLineDash([2,7]);line(g,INK,2.5,[mx0,my,mx0+mw,my]);g.setLineDash([]);circ(g,RED,mx0+mw*p,my,7);
      poly(g,INK,[mx0-14,my+7,mx0-14,my-3,mx0-7,my-9,mx0,my-3,mx0,my+7]);const ex=mx0+mw+3;
      if(cfg.dest==='market'){rect(g,INK,ex,my-8,6,15);rect(g,INK,ex+7,my-3,7,10)}else poly(g,INK,[ex,my+7,ex,my-3,ex+7,my-9,ex+14,my-3,ex+14,my+7])})},
  down(x,y){boost=.9;const cx=cam();for(const m of lm){if(!m.tap)continue;const sx=m.x-cx,sy=(m.front?gy(m.x)+m.dy:gy(m.x)-20+m.dy)-40*m.s;
      if(Math.abs(x-sx)<46*m.s&&Math.abs(y-sy)<64*m.s){m.hop=1;if(m.tap==='sheep')sfx.baa();else if(m.tap==='goose')sfx.honk();
        else{sfx.rustle();if(cfg.season==='autumn')leaves(sx,sy-30*m.s,7,['#c8552b','#e0972f','#d9b84a'])}break}}}
  };
  function drawMark(g,m,sx,sy){if(m.n==='sign'){PX=SC;g.save();sh(g);rect(g,DWOOD,sx-3,sy-78,7,78,1);g.translate(sx,sy-74);g.rotate(-.04);poly(g,PAPER,[-66,-17,58,-17,76,0,58,17,-66,17]);txt(g,m.text,-2,1,21,INK);g.restore();return}
    const hop=Math.sin(m.hop*Math.PI)*16;
    if(m.n==='sheep'){put(g,'sheep',sx,sy-hop,m.s,0,.5,1,m.fx||1);g.save();g.translate(sx,sy-hop);g.scale(m.s*(m.fx||1),m.s);const sp=sprite('fleece');g.drawImage(sp.c,-52,-70,sp.w,sp.h);g.restore();return}
    put(g,m.n,sx,sy-hop,m.s,m.tap==='tree'?Math.sin(m.hop*Math.PI*3)*.04:0,.5,1,m.fx||1)}
}
def('sun',90,90,g=>{circ(g,'#f6d98a',45,45,30);flat(g,()=>circ(g,'#f9e6a8',45,45,21))});
def('moon',80,80,g=>{circ(g,'#f8f1de',40,40,24);flat(g,()=>{circ(g,'#e6dcc0',33,34,5);circ(g,'#e6dcc0',47,48,3.5)})});

SCENES.road=()=>makeRoad({len:5100,season:'autumn',cart:()=>G.loaded,dest:'market',daynight:true,caption:'Walk to Portsmouth Market. Hold to walk!',

  marks:[[120,'barn',.95,-30],[330,'house',.8,-38],[470,'haystack',.9,-14],[560,'pumpkin',1,-6],[640,'sheep',.8,-20,{tap:'sheep'}],[730,'sheep',.7,-34,{tap:'sheep',fx:-1}],[810,'sheep',.85,-12,{tap:'sheep'}],
    [1130,'goose',.9,-8,{tap:'goose'}],[1190,'goose',.8,-16,{tap:'goose'}],[1250,'goose',.9,-6,{tap:'goose',fx:-1}],[1360,'cottage',.8,-36],
    [2150,'haystack',1,-20],[2260,'haystack',.8,-34],[2420,'sheep',.8,-16,{tap:'sheep'}],[2500,'sheep',.75,-30,{tap:'sheep',fx:-1}],
    [3420,'cottage',.85,-34],[3590,'church',.95,-42],[3760,'house',.75,-36],[3880,'goose',.9,-8,{tap:'goose'}],
    [4300,'sign',1,-6,{text:'Portsmouth'}],[4520,'ships',1,-62],[4700,'townrow',1,-34],[5180,'townrow',1.05,-36],[5620,'ships',1.1,-62],[5700,'townrow',1,-34],[5000,'stall',.8,-10],[5330,'stall',.8,-10]]});

/* ---- Portsmouth market ---- */
SCENES.market=()=>{const GY=474,GS=1.2,cx=()=>W*.19;let slots=[],phase='items',busy=0,oxX=0,oxGo=false,oxHop=0,cartGone=0,ph=0;const hop=[0,0,0];
  const bx=i=>W*(.6+i*.145);
  return{
  enter(){G.showCoins=true;slots=G.loaded.slice();while(slots.length<8)slots.push(null);oxX=cx()+158*GS*.96;setCap('Portsmouth Market! Tap the cart to sell.')},
  bg(g){sky(g,'#b7cdd0','#f4e6c4',380);put(g,'cloud',W*.3,70,1,0,.5,.5);put(g,'ships',W*.08,380,1.2,0,0,1);put(g,'ships',W*.62,376,1,0,0,1);
    rect(g,'#6f9aa6',-10,344,W+20,60);put(g,'townrow',W*.02,404,1.02,0,0,1);put(g,'townrow',W*.02+524,404,1.02,0,0,1);if(W>1040)put(g,'townrow',W*.02+1048,404,1.02,0,0,1);
    ground(g,'#b8a78a',400,4);flat(g,()=>{const r=rng(6);for(let i=0;i<160;i++)ell(g,i%2?'#a89678':'#c6b698',r()*W,412+r()*128,9+r()*5,4)});
    for(let i=0;i<3;i++)put(g,'stall',bx(i),GY-6,1)},
  update(dt){busy=Math.max(0,busy-dt);for(let i=0;i<3;i++)hop[i]=Math.max(0,hop[i]-dt*2.5);oxHop=Math.max(0,oxHop-dt*2);
    if(cartGone>0&&cartGone<1)cartGone=Math.min(1,cartGone+dt*1.2);
    if(oxGo){oxX+=dt*170;ph+=dt*9}
    G.hint=null;if(busy<=0&&G.t>1.5&&!flies.length){if(phase==='items'&&slots.filter(Boolean).length===8)G.hint={x:cx(),y:GY-70};else if(phase==='cart')G.hint={x:cx(),y:GY-60};else if(phase==='ox')G.hint={x:oxX+70,y:GY-70}}},
  draw(g){for(let i=0;i<3;i++)put(g,'buyer'+(i+1),bx(i),GY-36-Math.sin(hop[i]*Math.PI)*14,1.1);
    for(let i=0;i<3;i++){const sp=sprite('stall');g.save();g.beginPath();g.rect(bx(i)-90,GY-6-48,180,60);g.clip();put(g,'stall',bx(i),GY-6,1);g.restore()}
    if(cartGone<1){g.save();g.globalAlpha=1-cartGone;drawCart(g,cx()+cartGone*W*.5,GY-cartGone*40,GS*(1-cartGone*.4),0,cartGone*8,slots);g.restore()}
    drawOx(g,oxX,GY,GS,0,ph,Math.sin(oxHop*Math.PI)*12);drawMan(g,cx()-150>40?cx()-150:40,GY+10,1.15,0)},
  down(x,y){if(busy>0)return;const c=cx();
    if(phase==='items'&&x<c+150&&y>GY-200){let i=7;while(i>=0&&!slots[i])i--;if(i<0)return;const id=slots[i];slots[i]=null;busy=.45;const b=Math.floor(Math.random()*3),[sx,sy]=slotPos(i,c,GY,GS);sfx.pop();
      fly({name:id,x0:sx,y0:sy+16,x1:bx(b),y1:GY-52,s0:.6,s1:.9,arc:120,dur:.6,done(){hop[b]=1;earn(PRICE[id],bx(b),GY-110)}});
      if(!slots.some(Boolean)){phase='wait';setTimeout(()=>{phase='cart';setCap('Now sell the cart, too!')},1500)}}
    else if(phase==='cart'&&Math.abs(x-c)<170&&y>GY-190){phase='wait';cartGone=.01;sfx.pop();setTimeout(()=>{hop[1]=1;earn(3,bx(1),GY-110)},700);setTimeout(()=>{phase='ox';setCap('Kiss the ox goodbye on his nose.')},1700)}
    else if(phase==='ox'&&Math.abs(x-oxX-30)<150&&y>GY-200){phase='ox2';sfx.kiss();hearts(oxX+90,GY-80,5);oxHop=1;setTimeout(()=>sfx.moo(),350);setTimeout(()=>{oxGo=true;hop[2]=1;earn(5,bx(2),GY-110)},1300);setTimeout(()=>{phase='done';setCap('Coins in your pocket! Time to shop.');setNext(()=>go('shop'))},3600)}}
  };
};

/* ---- the shop ---- */
SCENES.shop=()=>{const gx=i=>W*(.2+i*.165),SY=272;let st=[],busy=0,khop=0;
  return{
  enter(){G.showCoins=true;G.bought=[];st=GIFTS.map(()=>0);setCap('Buy presents for the family!')},
  bg(g){flat(g,()=>{rect(g,'#c7a577',0,0,W,H);for(let x=0;x<W;x+=58)line(g,'#b3915f',2,[x,0,x,430])});
    rect(g,'#f4e6c4',W*.03,40,90,120,2);flat(g,()=>{rect(g,'#b7cdd0',W*.03+8,48,74,104);line(g,'#f4e6c4',5,[W*.03+45,48,W*.03+45,152]);line(g,'#f4e6c4',5,[W*.03+8,100,W*.03+82,100])});
    rect(g,DWOOD,W*.1,SY,W*.76,14,2);rect(g,DWOOD,W*.16,130,W*.6,12,2);
    ['honey','candles','sugar','mittens','brooms','wool'].forEach((n,i)=>put(g,n,W*.2+i*W*.1,130,.85));
    ground(g,'#8f6f4a',430,4);flat(g,()=>{for(let i=0;i<8;i++)line(g,'#7c5f3e',2,[i*W/7,436,i*W/7-40,H])});
    rect(g,'#74522f',W*.8,330,W*.2+10,140,3);rect(g,WOOD,W*.78,320,W*.22+10,16,3)},
  update(dt){busy=Math.max(0,busy-dt);khop=Math.max(0,khop-dt*2.5);const n=st.findIndex(s=>!s);G.hint=n>=0&&busy<=0&&G.t>1.5&&!flies.length?{x:gx(n),y:SY-50}:null},

  if(G.next){G.nextT+=1/60;const k=ease(clamp(G.nextT*3,0,1))*(1+Math.sin(G.t*5)*.07);g.save();g.translate(W-84,H-84);g.scale(k,k);sh(g);circ(g,RED,0,0,50);flat(g,()=>poly(g,PAPER,[-24,-11,4,-11,4,-27,30,0,4,27,4,11,-24,11]));g.restore()}
  if(G.hint&&!G.next){const h=G.hint,t=G.t;flat(g,()=>{const ox=h.rub?Math.sin(t*5)*34:0,press=h.hold?1:.5+.5*Math.sin(t*5);
      g.strokeStyle='rgba(241,230,204,.9)';g.lineWidth=5;g.beginPath();g.arc(h.x+ox,h.y,26+(1-press)*14,0,TAU);g.stroke();g.strokeStyle='rgba(155,58,42,.9)';g.lineWidth=2.5;g.beginPath();g.arc(h.x+ox,h.y,26+(1-press)*14,0,TAU);g.stroke();
      // a paper hand
      g.save();g.translate(h.x+ox+10,h.y+12+(1-press)*10);g.rotate(-.35);g.shadowColor='rgba(50,30,12,.35)';g.shadowBlur=4*SC;g.shadowOffsetY=2*SC;rect(g,'#e9c29c',-7,-4,14,34,7);rect(g,'#e9c29c',-9,18,34,30,10);rect(g,'#f3ead6',-9,42,34,14,3);g.restore()})}
}
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;G.t+=dt;
  if(G.fadeDir){G.fade=clamp(G.fade+G.fadeDir*dt*2.6,0,1);if(G.fade>=1&&G.fadeDir>0){enter(G.nextName);G.nextName=null;G.fadeDir=-1}else if(G.fade<=0&&G.fadeDir<0)G.fadeDir=0}
  const s=G.scene;if(s.update)s.update(dt);
  for(let i=flies.length-1;i>=0;i--){const f=flies[i];if(f.delay>0){f.delay-=dt;continue}if(!f.started){f.started=true;if(f.start)f.start()}f.t+=dt;if(f.t>=f.dur){flies.splice(i,1);if(f.done)f.done()}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(p.delay>0){p.delay-=dt;continue}p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.life<=0)parts.splice(i,1)}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=INK;ctx.fillRect(0,0,cw,ch);base();ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  PX=SC;sh(ctx);
  if(s.bg){const key=G.name+'|'+cw+'x'+ch;if(bgc.key!==key){bgc.key=key;const b=bgc.cv;b.width=Math.ceil(W*SC);b.height=Math.ceil(H*SC);const g=b.getContext('2d');g.setTransform(SC,0,0,SC,0,0);PX=SC;sh(g);s.bg(g)}
    ctx.drawImage(bgc.cv,0,0,W,H)}
  PX=SC;s.draw(ctx);
  for(const f of flies){if(f.delay>0)continue;const u=ease(f.t/f.dur);put(ctx,f.name,lerp(f.x0,f.x1,u),lerp(f.y0,f.y1,u)-Math.sin(u*Math.PI)*f.arc,lerp(f.s0,f.s1,u),0,.5,.5)}
  flat(ctx,()=>{for(const p of parts){if(p.delay>0)continue;const a=clamp(p.life/Math.min(.4,p.max),0,1);ctx.globalAlpha=a;
    if(p.kind==='heart')put(ctx,'heart',p.x,p.y,p.s,0,.5,.5);
    else if(p.kind==='spark'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);poly(ctx,p.col,[0,-p.s,p.s*.35,-p.s*.35,p.s,0,p.s*.35,p.s*.35,0,p.s,-p.s*.35,p.s*.35,-p.s,0,-p.s*.35,-p.s*.35]);ctx.restore()}
    else if(p.kind==='leaf')ell(ctx,p.col,p.x,p.y,p.s,p.s*.5,p.rot);
    else if(p.kind==='tuft')circ(ctx,'#fbf7ec',p.x,p.y,p.s);
    else if(p.kind==='drop')ell(ctx,p.col,p.x,p.y,p.s*.7,p.s);}ctx.globalAlpha=1});
  drawHUD(ctx);
  if(grain)flat(ctx,()=>{ctx.fillStyle=grain;ctx.fillRect(0,0,W,H)});
  if(G.fade>0)flat(ctx,()=>{ctx.fillStyle=`rgba(241,230,204,${ease(G.fade)})`;ctx.fillRect(0,0,W,H)});
  ctx.restore();requestAnimationFrame(frame)}

let pid=null;
stage.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(pid!==null&&e.pointerId!==pid)return;pid=e.pointerId;try{stage.setPointerCapture(pid)}catch(_){}
  const[x,y]=toLogical(e);G.px=x;G.py=y;
  if(Math.hypot(x-(W-42),y-42)<34){toggleSound();pid=null;return}
  if(G.fadeDir>0)return;
  if(G.next&&Math.hypot(x-(W-84),y-(H-84))<78){const f=G.next;G.next=null;sfx.pop();f();return}
  G.held=true;if(G.scene.down)G.scene.down(x,y)});
stage.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;const[x,y]=toLogical(e),dx=x-G.px,dy=y-G.py;G.px=x;G.py=y;if(G.scene.move)G.scene.move(x,y,dx,dy)});
const end=e=>{if(e.pointerId!==pid)return;pid=null;G.held=false;if(G.scene.up)G.scene.up()};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){G.held=true;audioInit()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowRight')G.held=false});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden)AC.suspend();else AC.resume()}});

resize();makeGrain();enter('title');
if(document.fonts&&document.fonts.load)document.fonts.load('30px "IM Fell English"').then(()=>{bgc.key=null}).catch(()=>{});
window.__ox={G,go,enter,get W(){return W}};
requestAnimationFrame(frame);
})();
</script>
